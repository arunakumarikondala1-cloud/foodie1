<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        .abc{
            text-align: center;
        }
    body{
        background: darkblue;
        color: white;
        align-items:center;
        justify-content:center;
        height:800px;
    }
    .timer{
        display:flex;
        justify-content:center;
        gap: 20px;
    }
    .timebox{
        background: white;
        color: blue;
        padding: 30px;
        box-shadow: 0 10px 10px black;
    }
    
    </style>
</head>
<body>
    <div class="abc">
         <h1>coming soon</h1>
         <p>Event starts in</p>
         <div class="timer">
            <div class="timebox">
                <span>10</span>
                <span>days</span>
            </div>
            <div class="timebox">
                <span>05</span>
                <span>hours</span>
            </div>
            <div class="timebox">
                <span>30</span>
                <span>minutes</span>
            </div>
            <div class="timebox">
                <span>45</span>
                <span>seconds</span>
            </div>
         </div>
    </div>
</body>
</html>
